<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Disaster Intelligence Dashboard</title>

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
    />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0b1220;
            color: #e5e7eb;
            height: 100vh;
            overflow: hidden;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* ---------------- HEADER ---------------- */

        header {
            height: 70px;
            background: #111827;
            border-bottom: 1px solid #263244;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 1000;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: #dc2626;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .brand h1 {
            font-size: 19px;
        }

        .brand p {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 3px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #86efac;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
        }

        /* ---------------- MAIN ---------------- */

        .main {
            flex: 1;
            display: flex;
            min-height: 0;
        }

        /* ---------------- LEFT PANEL ---------------- */

        .sidebar {
            width: 330px;
            background: #111827;
            border-right: 1px solid #263244;
            display: flex;
            flex-direction: column;
            z-index: 900;
        }

        .sidebar-header {
            padding: 18px;
            border-bottom: 1px solid #263244;
        }

        .sidebar-header h2 {
            font-size: 15px;
            margin-bottom: 14px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .stat {
            background: #1f2937;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-number {
            font-size: 19px;
            font-weight: bold;
        }

        .stat-label {
            font-size: 10px;
            color: #9ca3af;
            margin-top: 3px;
        }

        .filters {
            padding: 12px 18px;
            border-bottom: 1px solid #263244;
        }

        .filters select {
            width: 100%;
            background: #1f2937;
            border: 1px solid #374151;
            color: #e5e7eb;
            padding: 9px;
            border-radius: 7px;
            outline: none;
        }

        .event-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .event-card {
            background: #182131;
            border: 1px solid #263244;
            border-radius: 9px;
            padding: 12px;
            margin-bottom: 9px;
            cursor: pointer;
            transition: 0.2s;
        }

        .event-card:hover {
            border-color: #64748b;
            background: #1d293b;
        }

        .event-card.active {
            border-color: #ef4444;
        }

        .event-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 7px;
        }

        .event-type {
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .severity {
            font-size: 10px;
            padding: 3px 7px;
            border-radius: 20px;
            font-weight: bold;
        }

        .critical {
            background: #7f1d1d;
            color: #fecaca;
        }

        .high {
            background: #9a3412;
            color: #fed7aa;
        }

        .medium {
            background: #854d0e;
            color: #fef08a;
        }

        .low {
            background: #14532d;
            color: #bbf7d0;
        }

        .event-card h3 {
            font-size: 14px;
            margin-bottom: 5px;
        }

        .event-location {
            color: #9ca3af;
            font-size: 11px;
            margin-bottom: 6px;
        }

        .event-meta {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #6b7280;
        }

        /* ---------------- MAP ---------------- */

        .map-container {
            flex: 1;
            position: relative;
            min-width: 0;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* ---------------- MAP CONTROLS ---------------- */

        .map-controls {
            position: absolute;
            top: 18px;
            right: 18px;
            z-index: 1000;
            background: #111827;
            border: 1px solid #374151;
            border-radius: 9px;
            padding: 12px;
            width: 210px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.35);
        }

        .map-controls h3 {
            font-size: 12px;
            margin-bottom: 10px;
        }

        .layer-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            margin-bottom: 8px;
            cursor: pointer;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .red {
            background: #ef4444;
        }

        .blue {
            background: #3b82f6;
        }

        .green {
            background: #22c55e;
        }

        .yellow {
            background: #eab308;
        }

        .purple {
            background: #a855f7;
        }

        /* ---------------- DETAIL PANEL ---------------- */

        .details {
            width: 350px;
            background: #111827;
            border-left: 1px solid #263244;
            overflow-y: auto;
            padding: 18px;
        }

        .details h2 {
            font-size: 17px;
            margin-bottom: 5px;
        }

        .details-subtitle {
            font-size: 11px;
            color: #9ca3af;
            margin-bottom: 18px;
        }

        .empty {
            color: #6b7280;
            text-align: center;
            margin-top: 100px;
            font-size: 13px;
        }

        .detail-section {
            margin-bottom: 20px;
        }

        .detail-section h3 {
            font-size: 11px;
            color: #9ca3af;
            text-transform: uppercase;
            margin-bottom: 9px;
        }

        .detail-box {
            background: #182131;
            border: 1px solid #263244;
            border-radius: 8px;
            padding: 11px;
            margin-bottom: 7px;
        }

        .detail-label {
            font-size: 10px;
            color: #6b7280;
            margin-bottom: 3px;
        }

        .detail-value {
            font-size: 12px;
            color: #e5e7eb;
        }

        .coordinates {
            font-family: monospace;
            color: #93c5fd;
        }

        .confidence {
            height: 7px;
            width: 100%;
            background: #374151;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 7px;
        }

        .confidence-bar {
            height: 100%;
            background: #22c55e;
        }

        .source-tag {
            display: inline-block;
            background: #1e3a8a;
            color: #bfdbfe;
            padding: 5px 8px;
            border-radius: 5px;
            font-size: 10px;
            margin-right: 4px;
            margin-bottom: 4px;
        }

        /* ---------------- RESPONSIVE ---------------- */

        @media(max-width: 1100px) {
            .details {
                display: none;
            }
        }

        @media(max-width: 800px) {
            .sidebar {
                width: 270px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header>

        <div class="brand">

            <div class="brand-icon">
                ⚠
            </div>

            <div>
                <h1>Disaster Intelligence Dashboard</h1>
                <p>Integrated Incident Monitoring & Response</p>
            </div>

        </div>

        <div class="status">
            <span class="status-dot"></span>
            Demo System Online
        </div>

    </header>


    <!-- MAIN -->

    <div class="main">


        <!-- LEFT SIDEBAR -->

        <aside class="sidebar">

            <div class="sidebar-header">

                <h2>Current Incidents</h2>

                <div class="stats">

                    <div class="stat">
                        <div class="stat-number" id="totalEvents">
                            0
                        </div>

                        <div class="stat-label">
                            Events
                        </div>
                    </div>

                    <div class="stat">
                        <div class="stat-number" id="criticalEvents">
                            0
                        </div>

                        <div class="stat-label">
                            Critical
                        </div>
                    </div>

                    <div class="stat">
                        <div class="stat-number" id="facilityCount">
                            0
                        </div>

                        <div class="stat-label">
                            Facilities
                        </div>
                    </div>

                </div>

            </div>


            <div class="filters">

                <select id="eventFilter">

                    <option value="all">
                        All Incident Types
                    </option>

                    <option value="Flood">
                        Flood
                    </option>

                    <option value="Earthquake">
                        Earthquake
                    </option>

                    <option value="Cyclone">
                        Cyclone
                    </option>

                    <option value="Landslide">
                        Landslide
                    </option>

                    <option value="Wildfire">
                        Wildfire
                    </option>

                </select>

            </div>


            <div class="event-list" id="eventList">

            </div>

        </aside>


        <!-- MAP -->

        <main class="map-container">

            <div id="map"></div>


            <!-- MAP LAYER CONTROL -->

            <div class="map-controls">

                <h3>Map Layers</h3>

                <label class="layer-row">

                    <input
                        type="checkbox"
                        id="eventLayer"
                        checked
                    >

                    <span class="legend-dot red"></span>

                    Disaster Events

                </label>


                <label class="layer-row">

                    <input
                        type="checkbox"
                        id="hospitalLayer"
                        checked
                    >

                    <span class="legend-dot blue"></span>

                    Hospitals

                </label>


                <label class="layer-row">

                    <input
                        type="checkbox"
                        id="shelterLayer"
                        checked
                    >

                    <span class="legend-dot green"></span>

                    Shelters

                </label>


                <label class="layer-row">

                    <input
                        type="checkbox"
                        id="ngoLayer"
                        checked
                    >

                    <span class="legend-dot purple"></span>

                    NGOs / Relief

                </label>

            </div>

        </main>


        <!-- DETAILS -->

        <aside class="details" id="details">

            <div class="empty">

                Select an incident from the map or
                incident list to inspect its information.

            </div>

        </aside>

    </div>

</div>


<!-- LEAFLET -->

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin="">
</script>


<script>

    /* =========================================================
       DEMO DATA
       Replace this later with your backend / GeoMeteo data.
       ========================================================= */


    const disasterEvents = [

        {
            id: "DM-001",

            title: "Flood Incident",

            type: "Flood",

            location: "Guwahati, Assam",

            latitude: 26.1445,

            longitude: 91.7362,

            severity: "High",

            time: "2026-08-19 06:40",

            source: "Demo Incident Feed",

            description:
                "Flooding reported in a low-lying urban area. Water level is being monitored.",

            confidence: 86,

            casualties: "Not verified",

            verification:
                "Pending authority verification",

            hashtags:
                "#AssamFlood #FloodAlert #DisasterManagement"

        },


        {
            id: "DM-002",

            title: "Earthquake",

            type: "Earthquake",

            location: "Imphal, Manipur",

            latitude: 24.8170,

            longitude: 93.9368,

            severity: "Critical",

            time: "2026-08-19 05:55",

            source: "Seismic Monitoring Demo",

            description:
                "Earthquake event detected in the region. Ground impact requires field verification.",

            confidence: 94,

            casualties: "Unknown",

            verification:
                "Automated detection — human verification required",

            hashtags:
                "#Earthquake #Manipur #Emergency"

        },


        {
            id: "DM-003",

            title: "Cyclone Warning",

            type: "Cyclone",

            location: "Kolkata, West Bengal",

            latitude: 22.5726,

            longitude: 88.3639,

            severity: "Medium",

            time: "2026-08-19 04:20",

            source: "Weather Monitoring Demo",

            description:
                "Cyclonic weather conditions being monitored near the coastal region.",

            confidence: 91,

            casualties: "None reported",

            verification:
                "Weather-based observation",

            hashtags:
                "#Cyclone #WestBengal #WeatherAlert"

        },


        {
            id: "DM-004",

            title: "Landslide",

            type: "Landslide",

            location: "Dehradun, Uttarakhand",

            latitude: 30.3165,

            longitude: 78.0322,

            severity: "High",

            time: "2026-08-18 23:15",

            source: "Demo Social Signal",

            description:
                "Possible landslide reported near a road corridor. Verification required.",

            confidence: 68,

            casualties: "Unknown",

            verification:
                "Social signal — requires confirmation",

            hashtags:
                "#Landslide #Uttarakhand #RoadBlock"

        },


        {
            id: "DM-005",

            title: "Wildfire",

            type: "Wildfire",

            location: "Shimla, Himachal Pradesh",

            latitude: 31.1048,

            longitude: 77.1734,

            severity: "Medium",

            time: "2026-08-18 19:30",

            source: "Demo Remote Observation",

            description:
                "Possible wildfire activity observed in a forested region.",

            confidence: 73,

            casualties: "Unknown",

            verification:
                "Remote observation — field verification required",

            hashtags:
                "#Wildfire #Himachal #ForestFire"

        }

    ];


    /* =========================================================
       MAP INITIALIZATION
       ========================================================= */

    const map = L.map("map").setView(
        [23.5, 80.0],
        5
    );


    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            maxZoom: 19,
            attribution:
                '&copy; OpenStreetMap contributors'
        }
    ).addTo(map);


    /* =========================================================
       LAYER GROUPS
       ========================================================= */

    const eventLayer =
        L.layerGroup().addTo(map);

    const hospitalLayer =
        L.layerGroup().addTo(map);

    const shelterLayer =
        L.layerGroup().addTo(map);

    const ngoLayer =
        L.layerGroup().addTo(map);


    /* =========================================================
       ICONS
       ========================================================= */

    function createIcon(color) {

        return L.divIcon({

            className: "",

            html: `
                <div style="
                    width:18px;
                    height:18px;
                    background:${color};
                    border:3px solid white;
                    border-radius:50%;
                    box-shadow:0 0 10px ${color};
                "></div>
            `,

            iconSize: [18,18],

            iconAnchor: [9,9]

        });

    }


    const eventIcon =
        createIcon("#ef4444");

    const hospitalIcon =
        createIcon("#3b82f6");

    const shelterIcon =
        createIcon("#22c55e");

    const ngoIcon =
        createIcon("#a855f7");


    /* =========================================================
       ADD EVENTS
       ========================================================= */

    function renderEvents(filter = "all") {

        eventLayer.clearLayers();

        const list =
            document.getElementById("eventList");

        list.innerHTML = "";


        let visibleEvents =
            disasterEvents.filter(event => {

                if (filter === "all") {
                    return true;
                }

                return event.type === filter;

            });


        visibleEvents.forEach(event => {

            const marker =
                L.marker(
                    [
                        event.latitude,
                        event.longitude
                    ],
                    {
                        icon: eventIcon
                    }
                );


            marker.bindTooltip(
                event.title,
                {
                    direction: "top"
                }
            );


            marker.on(
                "click",
                () => showEventDetails(event)
            );


            marker.addTo(eventLayer);


            const card =
                document.createElement("div");


            card.className =
                "event-card";


            card.innerHTML = `

                <div class="event-top">

                    <span class="event-type">
                        ${event.type}
                    </span>

                    <span class="severity ${event.severity.toLowerCase()}">
                        ${event.severity}
                    </span>

                </div>


                <h3>
                    ${event.title}
                </h3>


                <div class="event-location">
                    📍 ${event.location}
                </div>


                <div class="event-meta">

                    <span>
                        ${event.time}
                    </span>

                    <span>
                        ${event.confidence}% confidence
                    </span>

                </div>

            `;


            card.addEventListener(
                "click",
                () => {

                    map.setView(
                        [
                            event.latitude,
                            event.longitude
                        ],
                        10
                    );

                    showEventDetails(event);

                }
            );


            list.appendChild(card);

        });


        updateStats();

    }


    /* =========================================================
       SHOW INCIDENT DETAILS
       ========================================================= */

    function showEventDetails(event) {

        const details =
            document.getElementById("details");


        details.innerHTML = `

            <h2>
                ${event.title}
            </h2>

            <div class="details-subtitle">
                Incident ID: ${event.id}
            </div>


            <div class="detail-section">

                <h3>
                    Incident
                </h3>


                <div class="detail-box">

                    <div class="detail-label">
                        Type
                    </div>

                    <div class="detail-value">
                        ${event.type}
                    </div>

                </div>


                <div class="detail-box">

                    <div class="detail-label">
                        Severity
                    </div>

                    <div class="detail-value">
                        ${event.severity}
                    </div>

                </div>


                <div class="detail-box">

                    <div class="detail-label">
                        Location
                    </div>

                    <div class="detail-value">
                        ${event.location}
                    </div>

                </div>

            </div>


            <div class="detail-section">

                <h3>
                    Coordinates
                </h3>


                <div class="detail-box">

                    <div class="detail-value coordinates">

                        ${event.latitude.toFixed(6)},
                        ${event.longitude.toFixed(6)}

                    </div>

                </div>

            </div>


            <div class="detail-section">

                <h3>
                    Time
                </h3>


                <div class="detail-box">

                    <div class="detail-value">

                        ${event.time}

                    </div>

                </div>

            </div>


            <div class="detail-section">

                <h3>
                    Intelligence
                </h3>


                <div class="detail-box">

                    <div class="detail-label">
                        Description
                    </div>

                    <div class="detail-value">
                        ${event.description}
                    </div>

                </div>


                <div class="detail-box">

                    <div class="detail-label">
                        Source
                    </div>

                    <div class="detail-value">

                        <span class="source-tag">
                            ${event.source}
                        </span>

                    </div>

                </div>


                <div class="detail-box">

                    <div class="detail-label">
                        Verification
                    </div>

                    <div class="detail-value">

                        ${event.verification}

                    </div>

                </div>

            </div>


            <div class="detail-section">

                <h3>
                    Confidence
                </h3>


                <div class="detail-box">

                    <div class="detail-value">

                        ${event.confidence}%

                    </div>


                    <div class="confidence">

                        <div
                            class="confidence-bar"
                            style="width:${event.confidence}%"
                        ></div>

                    </div>

                </div>

            </div>


            <div class="detail-section">

                <h3>
                    Social Signals
                </h3>


                <div class="detail-box">

                    <div class="detail-label">
                        Hashtags
                    </div>

                    <div class="detail-value">

                        ${event.hashtags}

                    </div>

                </div>

            </div>


            <div class="detail-section">

                <h3>
                    Impact
                </h3>


                <div class="detail-box">

                    <div class="detail-label">
                        Casualties
                    </div>

                    <div class="detail-value">

                        ${event.casualties}

                    </div>

                </div>

            </div>

        `;

    }


    /* =========================================================
       STATISTICS
       ========================================================= */

    function updateStats() {

        document.getElementById(
            "totalEvents"
        ).textContent =
            disasterEvents.length;


        document.getElementById(
            "criticalEvents"
        ).textContent =
            disasterEvents.filter(
                event =>
                    event.severity === "Critical"
            ).length;

    }


    /* =========================================================
       FACILITY DATA
       ========================================================= */

    /*
        These are demonstration facilities.

        Later we can fetch actual nearby facilities
        from OpenStreetMap Overpass API.
    */


    const facilities = [

        {
            name: "Emergency Hospital",
            type: "hospital",
            latitude: 26.1500,
            longitude: 91.7400
        },

        {
            name: "Relief Shelter",
            type: "shelter",
            latitude: 26.1380,
            longitude: 91.7280
        },

        {
            name: "Relief NGO",
            type: "ngo",
            latitude: 26.1450,
            longitude: 91.7500
        },

        {
            name: "Emergency Hospital",
            type: "hospital",
            latitude: 22.5800,
            longitude: 88.3700
        },

        {
            name: "Cyclone Shelter",
            type: "shelter",
            latitude: 22.5650,
            longitude: 88.3550
        }

    ];


    /* =========================================================
       ADD FACILITIES
       ========================================================= */

    facilities.forEach(
        facility => {

            let layer;

            let icon;


            if (facility.type === "hospital") {

                layer = hospitalLayer;
                icon = hospitalIcon;

            }

            else if (
                facility.type === "shelter"
            ) {

                layer = shelterLayer;
                icon = shelterIcon;

            }

            else {

                layer = ngoLayer;
                icon = ngoIcon;

            }


            const marker =
                L.marker(
                    [
                        facility.latitude,
                        facility.longitude
                    ],
                    {
                        icon: icon
                    }
                );


            marker.bindPopup(`

                <b>
                    ${facility.name}
                </b>

                <br>

                Type:
                ${facility.type}

                <br>

                Coordinates:
                ${facility.latitude},
                ${facility.longitude}

            `);


            marker.addTo(layer);

        }
    );


    document.getElementById(
        "facilityCount"
    ).textContent =
        facilities.length;


    /* =========================================================
       FILTER
       ========================================================= */

    document.getElementById(
        "eventFilter"
    ).addEventListener(
        "change",
        function () {

            renderEvents(this.value);

        }
    );


    /* =========================================================
       LAYER TOGGLES
       ========================================================= */

    document.getElementById(
        "eventLayer"
    ).addEventListener(
        "change",
        function () {

            if (this.checked) {

                map.addLayer(eventLayer);

            } else {

                map.removeLayer(eventLayer);

            }

        }
    );


    document.getElementById(
        "hospitalLayer"
    ).addEventListener(
        "change",
        function () {

            if (this.checked) {

                map.addLayer(hospitalLayer);

            } else {

    );

                map.addLayer(shelterLayer);

            } else {

                map.removeLayer(shelterLayer);

        }
    );


    document.getElementById(

    ).addEventListener(

                map.addLayer(ngoLayer);

            } else {

                map.removeLayer(ngoLayer);

        }
    );

    renderEvents();

</script>
