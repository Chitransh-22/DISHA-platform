<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Disaster Intelligence Dashboard</title>

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
    />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0b1220;
            color: #e5e7eb;
            height: 100vh;
            overflow: hidden;
        }

        .app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        /* ---------------- HEADER ---------------- */

        header {
            height: 70px;
            background: #111827;
            border-bottom: 1px solid #263244;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            z-index: 1000;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: #dc2626;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .brand h1 {
            font-size: 19px;
        }

        .brand p {
            font-size: 12px;
            color: #9ca3af;
            margin-top: 3px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #86efac;
        }

        .status-dot {
            width: 9px;
            height: 9px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 8px #22c55e;
        }

        /* ---------------- MAIN ---------------- */

        .main {
            flex: 1;
            display: flex;
            min-height: 0;
        }

        /* ---------------- LEFT PANEL ---------------- */

        .sidebar {
            width: 330px;
            background: #111827;
            border-right: 1px solid #263244;
            display: flex;
            flex-direction: column;
            z-index: 900;
        }

        .sidebar-header {
            padding: 18px;
            border-bottom: 1px solid #263244;
        }

        .sidebar-header h2 {
            font-size: 15px;
            margin-bottom: 14px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .stat {
            background: #1f2937;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }

        .stat-number {
            font-size: 19px;
            font-weight: bold;
        }

        .stat-label {
            font-size: 10px;
            color: #9ca3af;
            margin-top: 3px;
        }

        .filters {
            padding: 12px 18px;
            border-bottom: 1px solid #263244;
        }

        .filters select {
            width: 100%;
            background: #1f2937;
            border: 1px solid #374151;
            color: #e5e7eb;
            padding: 9px;
            border-radius: 7px;
            outline: none;
        }

        .event-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .event-card {
            background: #182131;
            border: 1px solid #263244;
            border-radius: 9px;
            padding: 12px;
            margin-bottom: 9px;
            cursor: pointer;
            transition: 0.2s;
        }

        .event-card:hover {
            border-color: #64748b;
            background: #1d293b;
        }

        .event-card.active {
            border-color: #ef4444;
        }

        .event-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 7px;
        }

        .event-type {
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .severity {
            font-size: 10px;
            padding: 3px 7px;
            border-radius: 20px;
            font-weight: bold;
        }

        .critical {
            background: #7f1d1d;
            color: #fecaca;
        }

        .high {
            background: #9a3412;
            color: #fed7aa;
        }

        .medium {
            background: #854d0e;
            color: #fef08a;
        }

        .low {
            background: #14532d;
            color: #bbf7d0;
        }

        .event-card h3 {
            font-size: 14px;
            margin-bottom: 5px;
        }

        .event-location {
            color: #9ca3af;
            font-size: 11px;
            margin-bottom: 6px;
        }

        .event-meta {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: #6b7280;
        }

        /* ---------------- MAP ---------------- */

        .map-container {
            flex: 1;
            position: relative;
            min-width: 0;
        }

        #map {
            width: 100%;
            height: 100%;
        }

        /* ---------------- MAP CONTROLS ---------------- */

        .map-controls {
            position: absolute;
            top: 18px;
            right: 18px;
            z-index: 1000;
            background: #111827;
            border: 1px solid #374151;
            border-radius: 9px;
            padding: 12px;
            width: 210px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.35);
        }

        .map-controls h3 {
            font-size: 12px;
            margin-bottom: 10px;
        }

        .layer-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 11px;
            margin-bottom: 8px;
            cursor: pointer;
        }

        .legend-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
        }

        .red {
            background: #ef4444;
        }

        .blue {
            background: #3b82f6;
        }

        .green {
            background: #22c55e;
        }

        .yellow {
            background: #eab308;
        }

        .purple {
            background: #a855f7;
        }

        /* ---------------- DETAIL PANEL ---------------- */

        .details {
            width: 350px;
            background: #111827;
            border-left: 1px solid #263244;
            overflow-y: auto;
            padding: 18px;
        }

        .details h2 {
            font-size: 17px;
            margin-bottom: 5px;
        }

        .details-subtitle {
            font-size: 11px;
            color: #9ca3af;
            margin-bottom: 18px;
        }

        .empty {
            color: #6b7280;
            text-align: center;
            margin-top: 100px;
            font-size: 13px;
        }

        .detail-section {
            margin-bottom: 20px;
        }

        .detail-section h3 {
            font-size: 11px;
            color: #9ca3af;
            text-transform: uppercase;
            margin-bottom: 9px;
        }

        .detail-box {
            background: #182131;
            border: 1px solid #263244;
            border-radius: 8px;
            padding: 11px;
            margin-bottom: 7px;
        }

        .detail-label {
            font-size: 10px;
            color: #6b7280;
            margin-bottom: 3px;
        }

        .detail-value {
            font-size: 12px;
            color: #e5e7eb;
        }

        .coordinates {
            font-family: monospace;
            color: #93c5fd;
        }

        .confidence {
            height: 7px;
            width: 100%;
            background: #374151;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 7px;
        }

        .confidence-bar {
            height: 100%;
            background: #22c55e;
        }

        .source-tag {
            display: inline-block;
            background: #1e3a8a;
            color: #bfdbfe;
            padding: 5px 8px;
            border-radius: 5px;
            font-size: 10px;
            margin-right: 4px;
            margin-bottom: 4px;
        }

        /* ---------------- NEARBY EMERGENCY SERVICES ---------------- */

        .nearby-panel {
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid #263244;
        }

        .nearby-title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .nearby-heading {
            font-size: 12px;
            font-weight: bold;
            color: #38bdf8;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .pulse-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #38bdf8;
            box-shadow: 0 0 8px #38bdf8;
            animation: pulse-glow 1.5s infinite;
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        .nearby-loading {
            background: #182131;
            border: 1px solid #263244;
            border-radius: 8px;
            padding: 14px;
            text-align: center;
            font-size: 12px;
            color: #9ca3af;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid rgba(56, 189, 248, 0.2);
            border-top-color: #38bdf8;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .nearby-category {
            margin-bottom: 12px;
        }

        .category-header {
            font-size: 11px;
            font-weight: bold;
            color: #9ca3af;
            text-transform: uppercase;
            margin-bottom: 6px;
            display: flex;
            justify-content: space-between;
        }

        .service-card {
            background: #182131;
            border: 1px solid #263244;
            border-radius: 7px;
            padding: 9px 11px;
            margin-bottom: 6px;
            transition: border-color 0.15s ease;
        }

        .service-card:hover {
            border-color: #38bdf8;
        }

        .service-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 6px;
            margin-bottom: 3px;
        }

        .service-name {
            font-size: 12px;
            font-weight: bold;
            color: #e5e7eb;
            line-height: 1.3;
        }

        .service-dist {
            font-size: 10px;
            font-family: monospace;
            background: rgba(56, 189, 248, 0.15);
            color: #38bdf8;
            padding: 2px 5px;
            border-radius: 4px;
            white-space: nowrap;
        }

        .service-address {
            font-size: 10px;
            color: #9ca3af;
            margin-bottom: 6px;
            line-height: 1.2;
        }

        .service-actions {
            display: flex;
            gap: 6px;
            margin-top: 6px;
        }

        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            font-weight: bold;
            padding: 4px 8px;
            border-radius: 4px;
            text-decoration: none;
            cursor: pointer;
            border: none;
        }

        .btn-dir {
            background: #0284c7;
            color: #ffffff;
        }

        .btn-dir:hover {
            background: #0369a1;
        }

        .btn-call {
            background: #16a34a;
            color: #ffffff;
        }

        .btn-call:hover {
            background: #15803d;
        }

        .nearby-empty {
            background: #182131;
            border: 1px solid #263244;
            border-radius: 7px;
            padding: 10px;
            text-align: center;
            font-size: 11px;
            color: #6b7280;
        }

        .nearby-error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 7px;
            padding: 10px;
            color: #fca5a5;
            font-size: 11px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .btn-retry {
            align-self: flex-start;
            background: #1f2937;
            border: 1px solid #374151;
            color: #e5e7eb;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 10px;
            cursor: pointer;
        }

        /* ---------------- RESPONSIVE ---------------- */

        @media(max-width: 1100px) {
            .details {
                display: none;
            }
        }

        @media(max-width: 800px) {
            .sidebar {
                width: 270px;
            }
        }
    </style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <header>

        <div class="brand">

            <div class="brand-icon">
                ⚠
            </div>

            <div>
                <h1>Disaster Intelligence Dashboard</h1>
                <p>Integrated Incident Monitoring & Response</p>
            </div>

        </div>

        <div class="status">
            <span class="status-dot"></span>
            Demo System Online
        </div>

    </header>


    <!-- MAIN -->

    <div class="main">


        <!-- LEFT SIDEBAR -->

        <aside class="sidebar">

            <div class="sidebar-header">

                <h2>Current Incidents</h2>

                <div class="stats">

                    <div class="stat">
                        <div class="stat-number" id="totalEvents">
                            0
                        </div>

                        <div class="stat-label">
                            Events
                        </div>
                    </div>

                    <div class="stat">
                        <div class="stat-number" id="criticalEvents">
                            0
                        </div>

                        <div class="stat-label">
                            Critical
                        </div>
                    </div>

                    <div class="stat">
                        <div class="stat-number" id="facilityCount">
                            0
                        </div>

                        <div class="stat-label">
                            Facilities
                        </div>
                    </div>

                </div>

            </div>


            <div class="filters">

                <select id="eventFilter">

                    <option value="all">
                        All Incident Types
                    </option>

                    <option value="Flood">
                        Flood
                    </option>

                    <option value="Earthquake">
                        Earthquake
                    </option>

                    <option value="Cyclone">
                        Cyclone
                    </option>

                    <option value="Landslide">
                        Landslide
                    </option>

                    <option value="Wildfire">
                        Wildfire
                    </option>

                </select>

            </div>


            <div class="event-list" id="eventList">

            </div>

        </aside>


        <!-- MAP -->

        <main class="map-container">

            <div id="map"></div>


            <!-- MAP LAYER CONTROL -->

            <div class="map-controls">

                <h3>Map Layers</h3>

                <label class="layer-row">

                    <input
                        type="checkbox"
                        id="eventLayer"
                        checked
                    >

                    <span class="legend-dot red"></span>

                    Disaster Events

                </label>


                <label class="layer-row">

                    <input
                        type="checkbox"
                        id="hospitalLayer"
                        checked
                    >

                    <span class="legend-dot blue"></span>

                    Hospitals

                </label>


                <label class="layer-row">

                    <input
                        type="checkbox"
                        id="shelterLayer"
                        checked
                    >

                    <span class="legend-dot green"></span>

                    Shelters

                </label>


                <label class="layer-row">

                    <input
                        type="checkbox"
                        id="ngoLayer"
                        checked
                    >

                    <span class="legend-dot purple"></span>

                    NGOs / Relief

                </label>

            </div>

        </main>


        <!-- DETAILS -->

        <aside class="details" id="details">

            <div class="empty">

                Select an incident from the map or
                incident list to inspect its information.

            </div>

        </aside>

    </div>

</div>


<!-- LEAFLET -->

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin="">
</script>


<script>

    /* =========================================================
       DEMO DATA
       Replace this later with your backend / GeoMeteo data.
       ========================================================= */


    const disasterEvents = [

        {
            id: "DM-001",

            title: "Flood Incident",

            type: "Flood",

            location: "Guwahati, Assam",

            latitude: 26.1445,

            longitude: 91.7362,

            severity: "High",

            time: "2026-08-19 06:40",

            source: "Demo Incident Feed",

            description:
                "Flooding reported in a low-lying urban area. Water level is being monitored.",

            confidence: 86,

            casualties: "Not verified",

            verification:
                "Pending authority verification",

            hashtags:
                "#AssamFlood #FloodAlert #DisasterManagement"

        },


        {
            id: "DM-002",

            title: "Earthquake",

            type: "Earthquake",

            location: "Imphal, Manipur",

            latitude: 24.8170,

            longitude: 93.9368,

            severity: "Critical",

            time: "2026-08-19 05:55",

            source: "Seismic Monitoring Demo",

            description:
                "Earthquake event detected in the region. Ground impact requires field verification.",

            confidence: 94,

            casualties: "Unknown",

            verification:
                "Automated detection — human verification required",

            hashtags:
                "#Earthquake #Manipur #Emergency"

        },


        {
            id: "DM-003",

            title: "Cyclone Warning",

            type: "Cyclone",

            location: "Kolkata, West Bengal",

            latitude: 22.5726,

            longitude: 88.3639,

            severity: "Medium",

            time: "2026-08-19 04:20",

            source: "Weather Monitoring Demo",

            description:
                "Cyclonic weather conditions being monitored near the coastal region.",

            confidence: 91,

            casualties: "None reported",

            verification:
                "Weather-based observation",

            hashtags:
                "#Cyclone #WestBengal #WeatherAlert"

        },


        {
            id: "DM-004",

            title: "Landslide",

            type: "Landslide",

            location: "Dehradun, Uttarakhand",

            latitude: 30.3165,

            longitude: 78.0322,

            severity: "High",

            time: "2026-08-18 23:15",

            source: "Demo Social Signal",

            description:
                "Possible landslide reported near a road corridor. Verification required.",

            confidence: 68,

            casualties: "Unknown",

            verification:
                "Social signal — requires confirmation",

            hashtags:
                "#Landslide #Uttarakhand #RoadBlock"

        },


        {
            id: "DM-005",

            title: "Wildfire",

            type: "Wildfire",

            location: "Shimla, Himachal Pradesh",

            latitude: 31.1048,

            longitude: 77.1734,

            severity: "Medium",

            time: "2026-08-18 19:30",

            source: "Demo Remote Observation",

            description:
                "Possible wildfire activity observed in a forested region.",

            confidence: 73,

            casualties: "Unknown",

            verification:
                "Remote observation — field verification required",

            hashtags:
                "#Wildfire #Himachal #ForestFire"

        }

    ];


    /* =========================================================
       MAP INITIALIZATION
       ========================================================= */

    const map = L.map("map").setView(
        [23.5, 80.0],
        5
    );

    // Realistic Base Maps
    const streetLayer = L.tileLayer(
        "https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",
        {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap &copy; CARTO'
        }
    ).addTo(map);

    const satelliteLayer = L.layerGroup([
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            attribution: '&copy; Esri, Maxar, Earthstar Geographics',
            maxZoom: 19
        }),
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
            attribution: '&copy; Esri',
            maxZoom: 19
        })
    ]);

    const terrainLayer = L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}",
        {
            maxZoom: 19,
            attribution: '&copy; Esri &copy; OpenStreetMap'
        }
    );

    const darkLayer = L.tileLayer(
        "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",
        {
            maxZoom: 19,
            attribution: '&copy; CARTO &copy; OpenStreetMap'
        }
    );

    const baseMaps = {
        "🗺️ Real Street Map": streetLayer,
        "🛰️ Satellite (Hybrid)": satelliteLayer,
        "🏔️ Terrain & Topo": terrainLayer,
        "🌙 Tactical Dark": darkLayer
    };


    /* =========================================================
       LAYER GROUPS
       ========================================================= */

    const eventLayer =
        L.layerGroup().addTo(map);

    const hospitalLayer =
        L.layerGroup().addTo(map);

    const shelterLayer =
        L.layerGroup().addTo(map);

    const ngoLayer =
        L.layerGroup().addTo(map);

    L.control.layers(
        baseMaps,
        {
            "⚠️ Incidents": eventLayer,
            "🏥 Medical": hospitalLayer,
            "🏠 Shelters": shelterLayer,
            "🤝 NGOs": ngoLayer
        },
        { position: 'topright', collapsed: true }
    ).addTo(map);


    /* =========================================================
       ICONS
       ========================================================= */

    function createIcon(color) {

        return L.divIcon({

            className: "",

            html: `
                <div style="
                    width:18px;
                    height:18px;
                    background:${color};
                    border:3px solid white;
                    border-radius:50%;
                    box-shadow:0 0 10px ${color};
                "></div>
            `,

            iconSize: [18,18],

            iconAnchor: [9,9]

        });

    }


    const eventIcon =
        createIcon("#ef4444");

    const hospitalIcon =
        createIcon("#3b82f6");

    const shelterIcon =
        createIcon("#22c55e");

    const ngoIcon =
        createIcon("#a855f7");


    /* =========================================================
       ADD EVENTS
       ========================================================= */

    function renderEvents(filter = "all") {

        eventLayer.clearLayers();

        const list =
            document.getElementById("eventList");

        list.innerHTML = "";


        let visibleEvents =
            disasterEvents.filter(event => {

                if (filter === "all") {
                    return true;
                }

                return event.type === filter;

            });


        visibleEvents.forEach(event => {

            const marker =
                L.marker(
                    [
                        event.latitude,
                        event.longitude
                    ],
                    {
                        icon: eventIcon
                    }
                );


            marker.bindTooltip(
                event.title,
                {
                    direction: "top"
                }
            );


            marker.on(
                "click",
                () => showEventDetails(event)
            );


            marker.addTo(eventLayer);


            const card =
                document.createElement("div");


            card.className =
                "event-card";


            card.innerHTML = `

                <div class="event-top">

                    <span class="event-type">
                        ${event.type}
                    </span>

                    <span class="severity ${event.severity.toLowerCase()}">
                        ${event.severity}
                    </span>

                </div>


                <h3>
                    ${event.title}
                </h3>


                <div class="event-location">
                    📍 ${event.location}
                </div>


                <div class="event-meta">

                    <span>
                        ${event.time}
                    </span>

                    <span>
                        ${event.confidence}% confidence
                    </span>

                </div>

            `;


            card.addEventListener(
                "click",
                () => {

                    map.setView(
                        [
                            event.latitude,
                            event.longitude
                        ],
                        10
                    );

                    showEventDetails(event);

                }
            );


            list.appendChild(card);

        });

    /* =========================================================
       DYNAMIC NEARBY EMERGENCY SERVICES (OVERPASS / BACKEND API)
       ========================================================= */

    const nearbyCacheIndex = new Map();
    const dynamicEmergencyLayer = L.layerGroup().addTo(map);

    function haversineIndex(lat1, lon1, lat2, lon2) {
        const R = 6371.0;
        const dLat = (lat2 - lat1) * Math.PI / 180;
        const dLon = (lon2 - lon1) * Math.PI / 180;
        const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
                  Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                  Math.sin(dLon / 2) * Math.sin(dLon / 2);
        const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        return Math.round(R * c * 100) / 100;
    }

    function estimateTimeIndex(distKm) {
        if (distKm <= 0.2) return 1;
        return Math.max(1, Math.round((distKm / 35.0) * 60));
    }

    function formatDistIndex(distKm) {
        if (distKm < 1.0) return `${Math.round(distKm * 1000)} m`;
        return `${distKm.toFixed(1)} km`;
    }

    function formatTimeIndex(min) {
        if (min < 60) return `~${min} min`;
        const hrs = Math.floor(min / 60);
        const rem = min % 60;
        return rem === 0 ? `~${hrs} hr` : `~${hrs} hr ${rem} min`;
    }

    async function fetchOverpassFallbackIndex(lat, lng) {
        const radiusKm = 5.0;
        const deltaLat = radiusKm / 111.0;
        const cosLat = Math.cos(lat * Math.PI / 180.0);
        const deltaLng = radiusKm / (111.0 * Math.max(0.01, cosLat));
        const south = (lat - deltaLat).toFixed(5);
        const north = (lat + deltaLat).toFixed(5);
        const west = (lng - deltaLng).toFixed(5);
        const east = (lng + deltaLng).toFixed(5);

        const q = `[out:json][timeout:10][bbox:${south},${west},${north},${east}];(node["amenity"~"^(hospital|clinic|doctors|police|fire_station)$"];way["amenity"~"^(hospital|clinic|doctors|police|fire_station)$"];node["emergency"~"^(ambulance_station|fire_service)$"];way["emergency"~"^(ambulance_station|fire_service)$"];);out center body;`;
        const endpoints = [
            'https://overpass.openstreetmap.fr/api/interpreter',
            'https://overpass-api.de/api/interpreter',
            'https://lz4.overpass-api.de/api/interpreter',
            'https://overpass.kumi.systems/api/interpreter'
        ];
        let elements = [];
        for (const ep of endpoints) {
            try {
                const resp = await fetch(ep, {
                    method: 'POST',
                    body: 'data=' + encodeURIComponent(q),
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    signal: AbortSignal.timeout(4000)
                });
                if (!resp.ok) continue;
                const json = await resp.json();
                elements = json.elements || [];
                break;
            } catch(e) {}
        }

        const med = [], pol = [], fire = [];
        const seen = new Set();

        elements.forEach(el => {
            const tags = el.tags || {};
            const sLat = el.lat != null ? el.lat : (el.center && el.center.lat);
            const sLon = el.lon != null ? el.lon : (el.center && el.center.lon);
            if (sLat == null || sLon == null) return;

            const amenity = (tags.amenity || '').toLowerCase();
            const emergency = (tags.emergency || '').toLowerCase();
            let cat = null, label = '', icon = '';
            if (amenity === 'hospital' || amenity === 'clinic' || amenity === 'doctors') {
                cat = 'medical'; label = 'Medical Centre / Hospital'; icon = '🏥';
            } else if (amenity === 'police') {
                cat = 'police'; label = 'Police Station'; icon = '🚔';
            } else if (amenity === 'fire_station' || emergency === 'ambulance_station') {
                cat = 'fire'; label = 'Fire/Ambulance Station'; icon = '🚒';
            }
            if (!cat) return;

            const name = tags.name || tags['name:en'] || label;
            const key = `${name.toLowerCase()}_${sLat.toFixed(3)}_${sLon.toFixed(3)}`;
            if (seen.has(key)) return;
            seen.add(key);

            const dist = haversineIndex(lat, lng, sLat, sLon);
            if (dist > radiusKm) return;

            const timeMin = estimateTimeIndex(dist);
            const phone = tags.phone || tags['contact:phone'] || tags['emergency:phone'] || tags.mobile || null;
            const addr = tags['addr:full'] || [tags['addr:street'], tags['addr:city'], tags['addr:state']].filter(Boolean).join(', ') || null;
            const dirUrl = `https://www.google.com/maps/dir/?api=1&origin=${lat.toFixed(6)},${lng.toFixed(6)}&destination=${sLat.toFixed(6)},${sLon.toFixed(6)}`;

            const item = {
                name,
                category: cat,
                category_label: label,
                icon,
                latitude: sLat,
                longitude: sLon,
                distance_km: dist,
                distance_formatted: formatDistIndex(dist),
                estimated_time_formatted: formatTimeIndex(timeMin),
                address: addr,
                phone: phone,
                directions_url: dirUrl
            };

            if (cat === 'medical') med.push(item);
            else if (cat === 'police') pol.push(item);
            else if (cat === 'fire') fire.push(item);
        });

        med.sort((a, b) => a.distance_km - b.distance_km);
        pol.sort((a, b) => a.distance_km - b.distance_km);
        fire.sort((a, b) => a.distance_km - b.distance_km);

        return {
            medical: med,
            police: pol,
            fire: fire
        };
    }

    async function loadNearbyServicesForIndex(lat, lng, eventId, forceRefresh = false) {
        const body = document.getElementById("nearbyEmergencyBody");
        if (!body) return;

        const cacheKey = `${lat.toFixed(3)}_${lng.toFixed(3)}_5km`;
        dynamicEmergencyLayer.clearLayers();

        if (nearbyCacheIndex.has(cacheKey) && !forceRefresh) {
            renderNearbyEmergencyUI(nearbyCacheIndex.get(cacheKey), lat, lng);
            return;
        }

        body.innerHTML = `
            <div class="nearby-loading">
                <span class="spinner"></span>
                Finding nearby emergency services within 5 km...
            </div>
        `;

        let data = null;

        // Try local backend API first (5 km radius, all facilities)
        try {
            const resp = await fetch(`http://127.0.0.1:8000/api/emergency-services?lat=${lat}&lng=${lng}&radius=5000`, {
                signal: AbortSignal.timeout(4000)
            });
            if (resp.ok) {
                const json = await resp.json();
                data = json.services || json;
            }
        } catch(e) {}

        if (!data) {
            try {
                data = await fetchOverpassFallbackIndex(lat, lng);
            } catch(e) {
                console.error("Overpass fallback failed:", e);
            }
        }

        if (data) {
            nearbyCacheIndex.set(cacheKey, data);
            renderNearbyEmergencyUI(data, lat, lng);
        } else {
            body.innerHTML = `
                <div class="nearby-error">
                    <span>Nearby emergency services could not be loaded.</span>
                    <button class="btn-retry" onclick="loadNearbyServicesForIndex(${lat}, ${lng}, '${eventId}', true)">🔄 Retry</button>
                </div>
            `;
        }
    }

    function renderNearbyEmergencyUI(services, lat, lng) {
        const body = document.getElementById("nearbyEmergencyBody");
        if (!body) return;

        const med = services.medical || [];
        const pol = services.police || [];
        const fire = services.fire || [];
        const total = med.length + pol.length + fire.length;

        if (total === 0) {
            body.innerHTML = '<div class="nearby-empty">No nearby emergency services found.</div>';
            return;
        }

        function createServiceCard(svc) {
            const cleanPhone = svc.phone ? svc.phone.replace(/[^0-9+]/g, '') : '';
            return `
                <div class="service-card">
                    <div class="service-top">
                        <div class="service-name">${svc.name}</div>
                        <span class="service-dist">${svc.distance_formatted} • ${svc.estimated_time_formatted}</span>
                    </div>
                    ${svc.address ? `<div class="service-address">📍 ${svc.address}</div>` : ''}
                    <div class="service-actions">
                        <a href="${svc.directions_url}" target="_blank" class="btn-action btn-dir">
                            📍 Directions
                        </a>
                        ${svc.phone ? `<a href="tel:${cleanPhone}" class="btn-action btn-call">📞 Call</a>` : ''}
                    </div>
                </div>
            `;
        }

        let html = '';

        if (med.length > 0) {
            html += `
                <div class="nearby-category">
                    <div class="category-header">
                        <span>🏥 Medical Centre / Hospital</span>
                        <span style="color:#38bdf8;">${med.length} found</span>
                    </div>
                    ${med.map(createServiceCard).join('')}
                </div>
            `;
        }

        if (pol.length > 0) {
            html += `
                <div class="nearby-category">
                    <div class="category-header">
                        <span>🚔 Police Station</span>
                        <span style="color:#38bdf8;">${pol.length} found</span>
                    </div>
                    ${pol.map(createServiceCard).join('')}
                </div>
            `;
        }

        if (fire.length > 0) {
            html += `
                <div class="nearby-category">
                    <div class="category-header">
                        <span>🚒 Fire Station</span>
                        <span style="color:#38bdf8;">${fire.length} found</span>
                    </div>
                    ${fire.map(createServiceCard).join('')}
                </div>
            `;
        }

        body.innerHTML = html;

        // Render temporary emergency service pins on map
        dynamicEmergencyLayer.clearLayers();
        const all = [...med, ...pol, ...fire];
        all.forEach(svc => {
            if (svc.latitude == null || svc.longitude == null) return;
            const icon = L.divIcon({
                className: '',
                html: `
                    <div style="width:24px;height:24px;background:#0f172a;border:2px solid #38bdf8;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;box-shadow:0 0 8px #38bdf8;cursor:pointer;">
                        ${svc.icon || '📍'}
                    </div>
                `,
                iconSize: [24, 24],
                iconAnchor: [12, 12]
            });
            const m = L.marker([svc.latitude, svc.longitude], { icon: icon });
            m.bindPopup(`
                <b>${svc.icon || ''} ${svc.name}</b><br>
                <span style="color:#38bdf8;font-size:11px;">${svc.distance_formatted} from incident • ${svc.estimated_time_formatted}</span><br>
                ${svc.address ? `<span style="color:#9ca3af;font-size:11px;">📍 ${svc.address}</span><br>` : ''}
                <div style="margin-top:6px;">
                    <a href="${svc.directions_url}" target="_blank" style="background:#0284c7;color:#fff;padding:3px 8px;border-radius:3px;text-decoration:none;font-size:11px;font-weight:bold;">📍 Directions</a>
                    ${svc.phone ? `<a href="tel:${svc.phone.replace(/[^0-9+]/g, '')}" style="background:#16a34a;color:#fff;padding:3px 8px;border-radius:3px;text-decoration:none;font-size:11px;font-weight:bold;margin-left:4px;">📞 Call</a>` : ''}
                </div>
            `);
            dynamicEmergencyLayer.addLayer(m);
        });
    }
